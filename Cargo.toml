[package]
name         = "praline"
version      = "0.1.0"
description  = "Build your repo like a lazy boss."
authors      = ["wallago <henrotte.hugo@gmail.com>"]
license      = "MIT OR Apache-2.0"
readme       = "README.md"
repository   = "https://github.com/wallago/praline"
keywords     = ["tui", "repo", "builder", "devops", "cli"]
categories   = ["command-line-utilities", "development-tools"]
edition      = "2024"
rust-version = "1.85"
include      = ["src/**/*", "templates/**/*", "Cargo.*", "LICENSE*", "README.md", "CHANGELOG.md"]

[dependencies]
better-panic = "0.3.0"
clap = { version = "4.5.56", features = [
  "derive",
  "env",
  "wrap_help",
  "cargo",
] }
dirs = "6.0.0"
include_dir = "0.7.4"
indexmap = "2.14.0"
ratatui = "0.30.2"
ratatui-explorer = "0.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strum = { version = "0.28.0", features = ["derive"] }
syntect-assets = "0.23.6"
tempfile = "3.27.0"
termbg = "0.6.2"
thiserror = "2.0.18"
toml = "1.1.3"
tui-input = "0.15.3"
tui-syntax-highlight = "0.2.0"

[dev-dependencies]
pretty_assertions = "1.4.1"
rstest            = "0.24"

[profile.dev]
opt-level = 0
debug     = true

[profile.test]
opt-level = 0
debug     = true

[profile.release]
opt-level     = 3
debug         = false
panic         = "abort"
lto           = true
codegen-units = 1
strip         = true

[profile.bench]
opt-level = 3
debug     = false

[lints.rust]
missing_docs                  = "warn"
missing_debug_implementations = "warn"
unreachable_pub               = "warn"
unused_qualifications         = "warn"

[lints.clippy]
pedantic                      = { level = "warn", priority = -1 }
unwrap_used                   = "warn"
expect_used                   = "warn"
panic                         = "warn"
todo                          = "warn"
dbg_macro                     = "warn"
print_stdout                  = "warn"
missing_docs_in_private_items = "warn"
