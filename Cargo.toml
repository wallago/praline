[package]
name = "repo-builder"
version = "0.1.0"
description = "Build your repo like a lazy boss"
authors = ["wallago <henrotte.hugo@gmail.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/wallago/repo-builder"
keywords = ["tui", "repo", "builder", "tool", "devops"]
categories = ["tui repo builder tool"]
edition = "2024"
include = ["src/**/*", "Cargo.*", "LICENSE*", "README.md", "CHANGELOG.md"]

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
ratatui = "0.30.2"
termbg = "0.6.2"

[dev-dependencies]
pretty_assertions = "1.4.1"

[profile.dev]
opt-level = 0
debug = true
panic = "abort"

[profile.test]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = false
panic = "unwind"
lto = true
codegen-units = 1
strip = true

[profile.bench]
opt-level = 3
debug = false

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
missing_docs_in_private_items = "warn"
